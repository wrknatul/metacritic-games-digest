<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Metacritic Games Digest{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Games Digest</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}class="on"{% endif %}>Игры</a>
      <a href="/monitor" {% if request.url.path == '/monitor' %}class="on"{% endif %}>Мониторинг</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Данные: metacritic.com, обновление раз в час. Резюме и выводы по летсплеям сделаны LLM.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
